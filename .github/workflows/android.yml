name: Build & Publish Release APK

on:
  push:
    tags:
      - v*
  pull_request:
    branches: [ "master", "main" ] # Hem master hem main desteklenir
  workflow_dispatch: { }

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK for Default
      run: ./gradlew :app:assembleDefault

    - name: Get TAG_VERSION_NAME from build.gradle.kts
      id: get_version_info
      run: |
        TAG_VERSION_NAME=$(grep "val TAG_VERSION_NAME =" build.gradle.kts || grep "val TAG_VERSION_NAME =" app/build.gradle.kts | head -n 1 | awk '{print $4}' | tr -d '"')
        echo "TAG_VERSION_NAME=${TAG_VERSION_NAME}" >> $GITHUB_ENV
        echo "Extracted Version: $TAG_VERSION_NAME"

    - name: Prepare Output Directory
      run: mkdir -p build/app/outputs/apk/Default/release

    - name: Rename APK for Default
      run: |
        cp app/build/outputs/apk/default/release/app-default-release.apk build/app/outputs/apk/Default/release/AIDE-default.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-Default.apk
        path: build/app/outputs/apk/Default/release/AIDE-*.apk

    - name: Upload APK for Default to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        body_path: changlog/${{ env.TAG_VERSION_NAME }}/README.md
        tag_name: ${{ env.TAG_VERSION_NAME }}
        files: build/app/outputs/apk/Default/release/AIDE-*.apk
        token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
