name: Build & Publish Release APK

on:
  push:
    tags:
      - v*
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: { }

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flavor: [ Default, Termux ] # Gradle görevleri için büyük harfle başlatıldı

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # Alt modüllerin eksiksiz klonlanması için
        fetch-depth: 0        # Eksik commit referans hatalarını (not our ref) önlemek için tüm geçmişi çeker

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK for ${{ matrix.flavor }}
      run: ./gradlew :app:assemble${{ matrix.flavor }}

    - name: Get TAG_VERSION_NAME from build.gradle.kts
      id: get_version_info
      run: |
        TAG_VERSION_NAME=$(grep "val TAG_VERSION_NAME =" build.gradle.kts || grep "val TAG_VERSION_NAME =" app/build.gradle.kts | head -n 1 | awk '{print $4}' | tr -d '"')
        echo "TAG_VERSION_NAME=${TAG_VERSION_NAME}" >> $GITHUB_ENV
        echo "Extracted Version: $TAG_VERSION_NAME"

    - name: Prepare Output Directory
      run: mkdir -p build/app/outputs/apk/${{ matrix.flavor }}/release

    - name: Rename APK for ${{ matrix.flavor }}
      run: |
        LOWER_FLAVOR=$(echo "${{ matrix.flavor }}" | tr '[:upper:]' '[:lower:]')
        cp app/build/outputs/apk/$LOWER_FLAVOR/release/app-$LOWER_FLAVOR-release.apk build/app/outputs/apk/${{ matrix.flavor }}/release/AIDE-$LOWER_FLAVOR.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDE-${{ matrix.flavor }}.apk
        path: build/app/outputs/apk/${{ matrix.flavor }}/release/AIDE-*.apk

    - name: Upload APK for ${{ matrix.flavor }} to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        body_path: changlog/${{ env.TAG_VERSION_NAME }}/README.md
        tag_name: ${{ env.TAG_VERSION_NAME }}
        files: build/app/outputs/apk/${{ matrix.flavor }}/release/AIDE-*.apk
        token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
